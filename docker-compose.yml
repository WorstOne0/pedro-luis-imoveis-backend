services:
  backend:
    build: .
    container_name: pedro_luis_imoveis_backend
    restart: unless-stopped
    # Everything comes from .env; nothing secret is written in this file.
    env_file:
      - .env
    environment:
      # nginx-proxy reads these to route the domain to this container.
      - LETSENCRYPT_HOST=${HOST}
      - VIRTUAL_HOST=${HOST}
      - VIRTUAL_PORT=${PORT}
      # The dashboard posts listing photos and video here before they are
      # forwarded to the image service, so this needs the same headroom.
      - CLIENT_MAX_BODY_SIZE=320m
    expose:
      - ${PORT}
    networks:
      # pedro-net reaches the database and image service, nginx-proxy exposes
      # this container to the internet.
      - pedro-net
      - nginx-proxy

networks:
  # docker network create pedro-net
  pedro-net:
    external: true
  nginx-proxy:
    external: true
